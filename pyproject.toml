[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tvault"
version = "1.0.0"
description = "Local encrypted TOTP and password vault for the terminal, with a Chrome extension."
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[project.scripts]
tvault = "tvault.cli:main"

[tool.setuptools]
packages = ["tvault"]
