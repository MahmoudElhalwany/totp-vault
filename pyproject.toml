[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tvault"
version = "1.0.0"
description = "Local encrypted TOTP and password vault for the terminal, with a Chrome extension."
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

# Local QR decoding, so a Google Authenticator export never has to be
# pasted into a website. macOS uses Apple's Vision framework; on Linux
# install zbar-tools (or opencv-python-headless) instead.
[project.optional-dependencies]
qr = [
    "pyobjc-framework-Vision>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
]

[project.scripts]
tvault = "tvault.cli:main"

[tool.setuptools]
packages = ["tvault"]
