name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyflakes

      - name: Install local QR decoder (macOS)
        if: runner.os == 'macOS'
        run: python -m pip install -e ".[qr]"

      - name: Lint
        run: python -m pyflakes tvault scripts tests

      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: End-to-end CLI
        run: python tests/e2e_cli.py
