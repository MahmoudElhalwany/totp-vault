name: Bug report
description: Something behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste a TOTP secret, an `otpauth://` URI, a vault file, or a
        master password into an issue.** Describe the shape of the problem
        instead; redact anything sensitive.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. tvault add ...
        2. tvault code ...
        3. ...
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where does it happen?
      options:
        - Terminal CLI
        - Chrome extension
        - Install / native messaging host
        - Both CLI and extension
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `tvault status` and `python3 --version`, plus your OS and browser.
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Output
      description: Any error text, with secrets removed.
      render: shell
